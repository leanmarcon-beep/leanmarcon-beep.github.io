  :root {

    --surface: #FFFFFF;
    --ink: #12161D;
    --muted: #5C6675;
    --line: #D3D8DF;
    --accent: #DC4B1E;
    --accent-soft: rgba(220, 75, 30, 0.09);
    --pending-ink: #8A5A3F;
    --shadow: 0 1px 2px rgba(18, 22, 29, 0.05);
    --lift: 0 6px 24px rgba(18, 22, 29, 0.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0E1218;
      --surface: #161B23;
      --ink: #E7EBF0;
      --muted: #939EAD;
      --line: #272F3A;
      --accent: #FF6A3C;
      --accent-soft: rgba(255, 106, 60, 0.13);
      --pending-ink: #D9A184;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --lift: 0 6px 24px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0E1218;
    --surface: #161B23;
    --ink: #E7EBF0;
    --muted: #939EAD;
    --line: #272F3A;
    --accent: #FF6A3C;
    --accent-soft: rgba(255, 106, 60, 0.13);
    --pending-ink: #D9A184;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --lift: 0 6px 24px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  img { max-width: 100%; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1020px; margin: 0 auto; padding: 0 28px 120px; }

  .draft {
    background: var(--accent-soft);
    border-bottom: 1px solid var(--accent);
    color: var(--pending-ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    padding: 9px 28px;
    text-transform: uppercase;
  }

  header { padding: 68px 0 44px; }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 22px;
  }
  h1 {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-stretch: 125%;
    font-size: clamp(2.9rem, 8vw, 5.1rem);
    line-height: 0.96;
    letter-spacing: -0.025em;
    margin: 0 0 26px;
    text-wrap: balance;
  }
  .thesis {
    font-size: clamp(1.12rem, 2.4vw, 1.4rem);
    line-height: 1.5;
    max-width: 31em;
    margin: 0 0 34px;
  }
  .contact-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 26px;
    align-items: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
  }
  .contact-row a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--accent);
    padding-bottom: 1px;
  }
  .contact-row a:hover { color: var(--accent); }
  .contact-row .avail { color: var(--muted); }

  section { padding-top: 60px; }
  .sec-head {
    display: flex;
    align-items: baseline;
    gap: 16px;
    border-top: 2px solid var(--ink);
    padding-top: 12px;
    margin-bottom: 34px;
  }
  .sec-head h2 {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.06rem;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0;
  }
  .sec-head .note {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-left: auto;
    text-align: right;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
  }
  .metric { background: var(--surface); padding: 22px 20px 20px; position: relative; }
  .metric .num {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 2.15rem;
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
    display: block;
    margin-bottom: 8px;
  }
  .metric .num.pending {
    color: var(--pending-ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .metric .lbl {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    display: block;
  }

  .proj {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 28px;
    padding: 26px 0;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .proj:first-of-type { border-top: 1px solid var(--line); }
  section > .proj:first-of-type { border-top: 1px solid var(--line); }
  .proj-meta {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    line-height: 1.9;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .proj-meta .kind { color: var(--accent); display: block; }
  .proj h3 {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
  }
  .proj h3 a { color: inherit; text-decoration: none; border-bottom: 2px solid var(--accent); }
  .proj h3 a:hover { color: var(--accent); }
  .proj p { margin: 0 0 12px; max-width: 62ch; }
  .proj .outcome {
    color: var(--muted);
    font-size: 0.95rem;
    border-left: 2px solid var(--accent);
    padding-left: 14px;
    margin-bottom: 14px;
  }
  .items { margin: 0 0 14px; padding-left: 18px; max-width: 62ch; }
  .items li { margin-bottom: 5px; }
  .stack { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .stack .tag {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 3px 7px;
  }
  .linkline {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .videos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 18px;
  }
  .vcard, .slot {
    border-radius: 3px;
    aspect-ratio: 4 / 5;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 18px;
    position: relative;
    text-decoration: none;
  }
  .vcard {
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    color: var(--ink);
  }
  .vcard:hover { border-color: var(--accent); }
  .vcard .play {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
  }
  .vcard .vtitle {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.02rem;
    line-height: 1.2;
  }
  .vcard .vlink {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 6px;
    overflow-wrap: anywhere;
  }
  .slot {
    border: 1.5px dashed var(--accent);
    background: var(--accent-soft);
    justify-content: center;
    align-items: center;
    gap: 8px;
    text-align: center;
    color: var(--pending-ink);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .slot .n {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0;
  }

  .services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px 40px;
  }
  .svc { position: relative; }
  .svc h4 {
    font-family: "Archivo", ui-sans-serif, system-ui, sans-serif;

    padding: 4px 0 4px 16px;
    margin-top: 26px;
    color: var(--muted);
    font-size: 0.97rem;
  }
  .lead {
    font-size: 1.06rem;
    line-height: 1.5;
    max-width: 60ch;
    margin: -14px 0 26px;
  }
  .vcard .thumb {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
  }
  .vcard .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 42%, rgba(0,0,0,0.08) 100%);

  .vcard.has-thumb { overflow: hidden; border-color: transparent; }
  .vcard.has-thumb .vtitle, .vcard.has-thumb .vlink { position: relative; z-index: 2; color: #FFFFFF; }

  .toolgroups { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .tgroup {
    background: var(--surface);
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 22px;
    padding: 18px 20px;
    position: relative;

    font-size: 11.5px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);

  .tgroup .glist { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
  .tgroup .tool {
    font-size: 0.92rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 3px 9px;
    background: var(--ground);
  }

    margin-top: 62px;
    background: var(--surface);
    border: 1px solid var(--line);

    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    padding: 13px 22px;
    border-radius: 2px;
  }
  .cta a.btn:hover { filter: brightness(1.08); }

  a:focus-visible, button:focus-visible, [contenteditable]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- edición ---------- */
  .toolbar {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 50;
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--lift);
    border-radius: 4px;
    padding: 8px;
  }
  .toolbar button {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid var(--line);
    background: var(--ground);
    color: var(--ink);
    padding: 9px 14px;
    border-radius: 3px;
    cursor: pointer;
  }
  .toolbar button.primary { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
  .toolbar button:hover { filter: brightness(1.06); }
  .toolbar .status {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11.5px;
    color: var(--muted);
    padding: 0 6px;
    max-width: 210px;
  }

  .editing [data-path] {
    outline: 1px dashed var(--line);
    outline-offset: 3px;
    border-radius: 2px;
    min-width: 14px;
    display: inline-block;
  }
  .editing p[data-path], .editing li[data-path] { display: block; }
  .editing [data-path]:focus { outline: 2px solid var(--accent); background: var(--accent-soft); }
  .editing [data-path]:empty::before {
    content: attr(data-ph);
    color: var(--pending-ink);
    font-style: italic;
  }

  .rm {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    line-height: 1;
    padding: 4px 6px;
    border-radius: 2px;
    cursor: pointer;
  }
  .rm:hover { color: var(--accent); border-color: var(--accent); }
  .rm.corner { position: absolute; top: 8px; right: 8px; z-index: 2; }
  .add {
    border: 1px dashed var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 2px;
    cursor: pointer;
  }
  .add:hover { background: var(--accent-soft); }
  .add-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .ed-note {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--muted);
    margin: 6px 0 0;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
  @media (max-width: 680px) {
    .proj { grid-template-columns: 1fr; gap: 12px; }
    .tgroup { grid-template-columns: 1fr; gap: 10px; }
    .wrap { padding: 0 20px 120px; }
    header { padding: 44px 0 32px; }
  }
</style>

  function removeAt(path) {
    var ks = path.split("."), i = parseInt(ks.pop(), 10);
    var arr = ks.reduce(function (o, k) { return o[k]; }, DATA);
    arr.splice(i, 1);
  }
  function blank(collection) {
    if (collection === "metrics") return { value: "", label: "Nuevo dato" };
    if (collection === "projects") return {
      kind: "Tipo", status: "", title: "Proyecto nuevo", url: "",
      body: ["Contá qué es y para quién lo hiciste."], items: [], outcome: "", stack: []
    };
    if (collection === "videos") return { title: "", note: "", url: "" };
    if (collection === "services") return { title: "Servicio", text: "Qué resolvés." };
    if (collection === "tools") return { group: "Nueva categoría", items: ["Herramienta"] };
    return "";
  }
  function ed(path, ph) {
    if (!editing) return "";
    return ' data-path="' + esc(path) + '" contenteditable="true" data-ph="' + esc(ph || "escribí acá") + '"';
  }
  function rm(path, corner) {
    if (!editing) return "";
    return '<button class="rm' + (corner ? " corner" : "") + '" data-remove="' + esc(path) + '" title="Quitar">quitar</button>';
  }
  function add(path, label) {
    if (!editing) return "";
    return '<button class="add" data-add="' + esc(path) + '">+ ' + esc(label) + "</button>";
  }

  function renderHeader() {
    var h = "";
    if (DATA.draft) {
      h += '<div class="draft"><span' + ed("draftText", "aviso de borrador") + ">" + esc(DATA.draftText) + "</span></div>";
    }
    h += '<div class="wrap"><header>';
    h += '<p class="eyebrow"><span' + ed("eyebrow", "rubro y ciudad") + ">" + esc(DATA.eyebrow) + "</span></p>";
    h += "<h1" + ed("name", "tu nombre") + ">" + esc(DATA.name) + "</h1>";
    h += '<p class="thesis"><span' + ed("thesis", "tu frase") + ">" + esc(DATA.thesis) + "</span></p>";
    h += '<div class="contact-row">';
    if (editing) {
      h += '<span data-path="email" contenteditable="true" data-ph="tu mail">' + esc(DATA.email) + "</span>";
    } else {
      h += '<a href="mailto:' + esc(DATA.email) + '">' + esc(DATA.email) + "</a>";
    }
    if (editing) {
      h += '<span data-path="phone" contenteditable="true" data-ph="tu teléfono">' + esc(DATA.phone || "") + "</span>";
    } else if (DATA.phone) {
      h += '<a href="tel:' + esc(DATA.phone.replace(/[^+0-9]/g, "")) + '">' + esc(DATA.phone) + "</a>";
    }
    h += '<span class="avail"' + ed("availability", "disponibilidad") + ">" + esc(DATA.availability) + "</span>";
    h += "</div></header>";
    return h;
  }

  function renderSecHead(title, notePath, noteVal) {
    var h = '<div class="sec-head"><h2>' + esc(title) + "</h2>";
    if (noteVal !== undefined) {
      h += '<span class="note"' + ed(notePath, "nota") + ">" + esc(noteVal) + "</span>";
    }
    return h + "</div>";
  }

  function renderMetrics() {
    var h = "<section>" + renderSecHead("Alcance en redes", "metricsNote", DATA.metricsNote);
    h += '<div class="metrics">';
    DATA.metrics.forEach(function (m, i) {
      h += '<div class="metric">' + rm("metrics." + i, true);
      if (m.value) {
        h += '<span class="num"' + ed("metrics." + i + ".value", "número") + ">" + esc(m.value) + "</span>";
      } else if (editing) {
        h += '<span class="num pending" data-path="metrics.' + i + '.value" contenteditable="true" data-ph="poné el número"></span>';
      } else {
        h += '<span class="num pending">completar</span>';
      }
      h += '<span class="lbl"' + ed("metrics." + i + ".label", "qué mide") + ">" + esc(m.label) + "</span>";
      h += "</div>";
    });
    h += "</div>";
    if (editing) h += '<div class="add-row">' + add("metrics", "agregar dato") + "</div>";
    return h + "</section>";
  }

  function renderClients() {
    var h = "<section>" + renderSecHead("Trabajos", "projectsNote", DATA.projectsNote);
    h += renderProjects("cliente");
    if (DATA.moreProjects) {
      h += '<p class="more-note"' + ed("moreProjects", "proyectos que no entran") + ">" + esc(DATA.moreProjects) + "</p>";
    }
    return h + "</section>";
  }

  function renderOwn() {
    return "<section>" + renderSecHead("Proyectos propios", "ownNote", DATA.ownNote) +
           renderProjects("propio", null, null) + "</section>";
  }

  function renderProjects(grupo) {
    var h = "";
    DATA.projects.forEach(function (p, i) {
      if (grupo && p.group !== grupo) return;
      var b = "projects." + i;
      h += '<article class="proj">' + rm(b, true);
      h += '<div class="proj-meta"><span class="kind"' + ed(b + ".kind", "tipo") + ">" + esc(p.kind) + "</span>";
      h += "<span" + ed(b + ".status", "estado") + ">" + esc(p.status) + "</span></div><div>";
      h += "<h3>";
      if (editing) {
        h += '<span data-path="' + b + '.title" contenteditable="true" data-ph="nombre">' + esc(p.title) + "</span>";
      } else if (p.url) {
        h += '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.title) + "</a>";
      } else {
        h += esc(p.title);
      }
      h += "</h3>";
      if (editing) {
        h += '<p class="linkline">link: <span data-path="' + b + '.url" contenteditable="true" data-ph="https://… (opcional)">' + esc(p.url) + "</span></p>";
      }
      p.body.forEach(function (par, j) {
        h += "<p" + ed(b + ".body." + j, "párrafo") + ">" + esc(par) + "</p>";
        if (editing) h += '<p class="ed-note">' + rm(b + ".body." + j) + "</p>";
      });
      if (editing) h += '<div class="add-row">' + add(b + ".body", "párrafo") + "</div>";
      if (p.items.length || editing) {
        h += '<ul class="items">';
        p.items.forEach(function (it, j) {
          h += "<li" + ed(b + ".items." + j, "item") + ">" + esc(it) + "</li>";
        });
        h += "</ul>";
        if (editing) {
          h += '<div class="add-row">' + add(b + ".items", "item de lista");
          p.items.forEach(function (it, j) { h += rm(b + ".items." + j); });
          h += "</div>";
        }
      }
      if (p.outcome || editing) {
        h += '<p class="outcome"' + ed(b + ".outcome", "el resultado para el cliente") + ">" + esc(p.outcome) + "</p>";
      }
      h += '<div class="stack">';
      p.stack.forEach(function (t, j) {
        h += '<span class="tag"' + ed(b + ".stack." + j, "tag") + ">" + esc(t) + "</span>";
        if (editing) h += rm(b + ".stack." + j);
      });
      h += (editing ? add(b + ".stack", "tag") : "") + "</div></div></article>";
    });
    if (editing) h += '<div class="add-row">' + add("projects", "agregar trabajo") + "</div>";
    return h;
  }

  function renderVideos() {
    var h = "<section>" + renderSecHead("Ejemplos de piezas", "videosNote", DATA.videosNote);
    if (DATA.videosLead) {
      h += '<p class="lead"' + ed("videosLead", "bajada") + ">" + esc(DATA.videosLead) + "</p>";
    }
    h += '<div class="videos">';
    DATA.videos.forEach(function (v, i) {
      var b = "videos." + i;
      if (editing) {
        h += '<div class="vcard">' + rm(b, true);
        h += '<div class="play">▶</div>';
        h += '<div class="vtitle" data-path="' + b + '.title" contenteditable="true" data-ph="título">' + esc(v.title) + "</div>";
        h += '<div class="vlink" data-path="' + b + '.note" contenteditable="true" data-ph="detalle corto">' + esc(v.note || "") + "</div>";
        h += '<div class="vlink" data-path="' + b + '.url" contenteditable="true" data-ph="pegá el link">' + esc(v.url) + "</div>";
        h += "</div>";
      } else if (v.url) {
        h += '<a class="vcard' + (v.thumb ? " has-thumb" : "") + '" href="' + esc(v.url) + '" target="_blank" rel="noopener">';
        if (v.thumb) {
          h += '<div class="thumb" style="background-image:url(' + esc(v.thumb) + ')"></div><div class="shade"></div>';
        }
        h += '<div class="play">▶</div>';
        h += '<div class="vtitle">' + esc(v.title || "Ver video") + "</div>";
        h += '<div class="vlink">' + esc(v.note || "Ver pieza completa") + "</div></a>";
      } else {
        h += '<div class="slot"><span class="n">' + (i + 1) + "</span>Video pendiente</div>";
      }
    });
    h += "</div>";
    if (editing) h += '<div class="add-row">' + add("videos", "agregar video") + "</div>";
    return h + "</section>";
  }

  function renderServices() {
    var h = "<section>" + renderSecHead("Qué hago");
    h += '<div class="services">';
    DATA.services.forEach(function (s, i) {
      h += '<div class="svc">' + rm("services." + i, true);
      h += "<h4" + ed("services." + i + ".title", "servicio") + ">" + esc(s.title) + "</h4>";
      h += "<p" + ed("services." + i + ".text", "descripción") + ">" + esc(s.text) + "</p></div>";
    });
    h += "</div>";
    if (editing) h += '<div class="add-row">' + add("services", "agregar servicio") + "</div>";
    return h + "</section>";
  }

  function renderTools() {
    var h = "<section>" + renderSecHead("Herramientas", "toolsNote", DATA.toolsNote);
    h += '<div class="toolgroups">';
    DATA.tools.forEach(function (g, i) {
      if (!g.items.length && !editing) return;
      h += '<div class="tgroup">' + rm("tools." + i, true);
      h += '<div class="gname"' + ed("tools." + i + ".group", "categoría") + ">" + esc(g.group) + "</div>";
      h += '<div class="glist">';
      g.items.forEach(function (t, j) {
        h += '<span class="tool"' + ed("tools." + i + ".items." + j, "herramienta") + ">" + esc(t) + "</span>";
        if (editing) h += rm("tools." + i + ".items." + j);
      });
      h += (editing ? add("tools." + i + ".items", "herramienta") : "") + "</div></div>";
    });
    h += "</div>";
    if (editing) h += '<div class="add-row">' + add("tools", "agregar categoría") + "</div>";
    return h + "</section>";
  }

  function renderCta() {
    var h = '<div class="cta">';
    h += "<h2" + ed("ctaTitle", "título") + ">" + esc(DATA.ctaTitle) + "</h2>";
    h += "<p" + ed("ctaText", "texto") + ">" + esc(DATA.ctaText) + "</p>";
    if (editing) {
      h += '<span class="btn" style="display:inline-block;background:var(--accent);color:#fff;padding:13px 22px;border-radius:2px;font-family:JetBrains Mono,monospace;font-size:13px;text-transform:uppercase" data-path="ctaButton" contenteditable="true" data-ph="botón">' + esc(DATA.ctaButton) + "</span>";
    } else {
      h += '<a class="btn" href="mailto:' + esc(DATA.email) + '">' + esc(DATA.ctaButton) + "</a>";
    }
    return h + "</div></div>";
  }

  function renderHTML() {
    return renderHeader() + renderClients() + renderTools() + renderVideos() +
           renderOwn() + renderMetrics() + renderServices() + renderCta();
  }

  function renderToolbar() {
    if (!artifactApi) return "";
    var h = '<div class="toolbar">';
    if (status) h += '<span class="status">' + esc(status) + "</span>";
    if (editing) {
      h += '<button data-act="draft">' + (DATA.draft ? "Quitar borrador" : "Marcar borrador") + "</button>";
      h += '<button data-act="cancel">Cancelar</button>';
      h += '<button class="primary" data-act="save">Guardar</button>';
    } else {
      h += '<button class="primary" data-act="edit">Editar</button>';
    }
    return h + "</div>";
  }

  var root = document.getElementById("root");
  var bar = document.createElement("div");
  document.body.appendChild(bar);

  function paint() {
    document.body.classList.toggle("editing", editing);
    root.innerHTML = renderHTML();
    bar.innerHTML = renderToolbar();
  }

  root.addEventListener("input", function (e) {
    var el = e.target.closest && e.target.closest("[data-path]");
    if (!el || !editing) return;
    set(el.getAttribute("data-path"), el.textContent.trim());
  });

  root.addEventListener("click", function (e) {
    var addBtn = e.target.closest && e.target.closest("[data-add]");
    if (addBtn) {
      var p = addBtn.getAttribute("data-add");
      var arr = get(p);
      var key = p.split(".").pop();
      arr.push(blank(key));
      paint();
      return;
    }
    var rmBtn = e.target.closest && e.target.closest("[data-remove]");
    if (rmBtn) {
      removeAt(rmBtn.getAttribute("data-remove"));
      paint();
    }
  });

  bar.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-act]");
    if (!b) return;
    var act = b.getAttribute("data-act");
    if (act === "edit") { editing = true; status = ""; paint(); }
    else if (act === "cancel") { location.reload(); }
    else if (act === "draft") { DATA.draft = !DATA.draft; paint(); }
    else if (act === "save") { save(); }
  });

  function buildDoc() {
    var css = document.getElementById("pf-style").textContent;
    var app = document.getElementById("pf-app").textContent;
    var wasEditing = editing;
    editing = false;
    var markup = renderHTML();
    editing = wasEditing;
    var json = JSON.stringify(DATA).replace(/</g, "\\u003c");
    return '<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      "<title>" + esc(DATA.name) + "</title>\n" +
      '<link rel="stylesheet" href="' + FONTS + '">\n' +
      '<style id="pf-style">' + css + "</style>\n</head>\n<body>\n" +
      '<div id="root">' + markup + "</div>\n" +
      '<script type="application/json" id="pf-data">' + json + "<\/script>\n" +
      '<script id="pf-app">' + app + "<\/script>\n</body>\n</html>";
  }

  function save() {
    if (!artifactApi) return;
    status = "Guardando…";
    paint();
    artifactApi.publish(buildDoc()).then(function () {
      status = "Guardado";
      editing = false;
      paint();
    }).catch(function (err) {
      var code = err && err.code;
      if (code === "conflict") status = "Alguien guardó antes. Se recarga con esa versión.";
      else if (code === "not_granted" || code === "not_writer") status = "No tenés permiso de edición acá.";
      else status = "No se pudo guardar. Probá de nuevo.";
      paint();
    });
  }

  paint();

  if (window.claude && window.claude.use) {
    window.claude.use("artifact").then(function (api) {
      artifactApi = api;
      paint();
    }).catch(function () {});
  }
})();
</script>

</body>
</html>
